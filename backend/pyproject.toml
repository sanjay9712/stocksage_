[project]
name = "trading-app-backend"
version = "0.1.0"
description = "Intraday screener + explanations for NSE stocks (free data)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: tests that hit the live network (skipped offline)"]
